// Minimal Spring Boot host project demonstrating local-build consumption of the 3 cluster-* starters.
//
// 외부 프로젝트 시점에서 starter 를 사용하는 패턴을 그대로 보여줍니다. monorepo 와 분리된
// standalone Gradle project 입니다 — `settings.gradle` 에 다른 모듈을 include 하지 않습니다.
//
// 검증 절차:
//   1. 상위 monorepo 에서 publishToMavenLocal 수행:
//        ./gradlew :cluster-agent-spring-boot-starter:publishToMavenLocal \
//                  :cluster-agent-features-spring-boot-starter:publishToMavenLocal \
//                  :cluster-provisioning-spring-boot-starter:publishToMavenLocal
//   2. 본 example 디렉토리에서 빌드 + 실행:
//        cd examples/spring-boot-host && ./gradlew bootRun

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example.host'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()    // 4 starter 는 publishToMavenLocal 로 ~/.m2 에 게시되어 있어야 합니다.
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 3 cluster-* starter — 로컬 build 후 mavenLocal 에서 fetch.
    // version 은 starter build.gradle 의 findProperty('starterVersion') ?: '0.1.0-SNAPSHOT' 와 정합.
    // publish-starters.yml workflow 가 release tag push 시 -PstarterVersion=X.Y.Z 주입 — 그땐 0.1.0 등 release 좌표.
    implementation 'io.aipaas.cluster:cluster-agent-spring-boot-starter:0.1.0-SNAPSHOT'
    implementation 'io.aipaas.cluster:cluster-agent-features-spring-boot-starter:0.1.0-SNAPSHOT'
    implementation 'io.aipaas.cluster:cluster-provisioning-spring-boot-starter:0.1.0-SNAPSHOT'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
