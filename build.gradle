plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'idea'
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0' apply false
    id 'com.google.protobuf' version '0.9.4' apply false
}

wrapper {
    gradleVersion = '8.10.2'
}

bootJar { enabled = false }
jar { enabled = true }

ext {
    // Spring Boot 3.2.5 BOM 은 commons-lang3 를 3.13.0 으로 고정한다.
    // 그런데 apps/anycloud 가 쓰는 commons-compress 1.27.1 의 TarArchiveOutputStream 은
    // 3.15.0 에 추가된 org.apache.commons.lang3.ArrayFill 을 호출한다.
    // 방치하면 tar 를 쓰는 모든 경로(Testcontainers 의 컨테이너 파일 복사 포함)가
    // NoClassDefFoundError: org/apache/commons/lang3/ArrayFill 로 죽는다.
    // BOM property 를 덮어써서 commons-compress 가 요구하는 하한 이상으로 올린다.
    set('commons-lang3.version', '3.17.0')

    jacksonVersion = '2.17.2'
    lombokVersion = '1.18.36'
    mapstructVersion = '1.5.5.Final'
    lombokMapstructBindingVersion = '0.2.0'
    bouncyCastleVersion = '1.78.1'
    caffeineVersion = '3.1.8'
    reactorVersion = '3.6.5'
    resilience4jVersion = '2.2.0'
    micrometerVersion = '1.13.4'
    // Pulumi Java SDK — IaC engine. Automation API + provider 별 별도 artifact (com.pulumi:aws 등).
    pulumiSdkVersion = '1.30.0'
    pulumiAwsVersion = '6.78.0'
    pulumiGcpVersion = '8.41.1'
    pulumiAzureNativeVersion = '3.16.0'
    pulumiOciVersion = '3.16.0'
    pulumiAlicloudVersion = '3.97.0'
    pulumiDigitaloceanVersion = '4.63.0'
    pulumiOpenstackVersion = '5.4.1'
    pulumiTlsVersion = '5.2.0'
}

// AllProjects 설정
allprojects {
    group = 'com.aipaas.anycloud'
    version = '0.0.1-SNAPSHOT'
    sourceCompatibility = '21'

    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()

        // for QueryDSL
        maven { url "https://plugins.gradle.org/m2/" }
    }
}

// SubProjects 설정 — anycloud 같이 root 가 spring-boot-application 인 모듈만.
// 제외:
//  - loadtest        : 비 Spring 모듈, 자체 build.gradle
//  - cluster-agent-spring-boot-starter : library 모듈로 외부 consumer 한테 publish 됨 — 자체적으로
//                       필요한 plugin/dependency 만 declare. root 에서 webflux 같은 anycloud 전용
//                       dependency 를 transitively 끌어가면 외부 consumer POM 오염됨.
configure(subprojects.findAll { it.name != 'loadtest' && it.name != 'cluster-agent-spring-boot-starter' }) {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    // 관리하는 모듈에 공통 dependencies
    dependencies {
        compileOnly "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
        developmentOnly 'org.springframework.boot:spring-boot-devtools:3.2.5'
        implementation 'org.springframework.boot:spring-boot-starter-webflux'
    }
}

bootRun {
    String activeProfile = System.properties['spring.profiles.active']
    systemProperty "spring.profiles.active", activeProfile
}

// =============================================================================
// Jacoco test coverage — anycloud / starter 2 모듈만 측정. loadtest 는 비-Spring,
// cluster-observability-starter 는 별도 자체 build 파일.
//
// 사용:
//   ./gradlew :anycloud:test :anycloud:jacocoTestReport
//   ./gradlew :cluster-agent-spring-boot-starter:test :cluster-agent-spring-boot-starter:jacocoTestReport
//   open apps/anycloud/build/reports/jacoco/test/html/index.html
//
// CI gate (선택): ./gradlew jacocoTestCoverageVerification — INSTRUCTION 60% 미달 시 fail.
// =============================================================================
configure(subprojects.findAll {
    it.name == 'anycloud'
            || it.name == 'cluster-agent-spring-boot-starter'
            || it.name == 'cluster-agent-features-spring-boot-starter'
}) {
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = '0.8.12'
    }

    // Generated / DTO 코드는 측정 제외 — getter/setter / proto stub 은 우리가 통제 못 하는 noise.
    def coverageExcludes = [
            '**/gen/agent/v1/**',
            'com/aipaas/anycloud/agent/v1/**',
            '**/dto/**',
            '**/*Dto*',
    ]

    // Library 모듈 (java-library) 은 자체 build.gradle 에서 java/test task 가 늦게 register —
    // afterEvaluate 로 모든 plugin 이 settle 된 후 wiring.
    afterEvaluate {
        tasks.named('test') {
            finalizedBy 'jacocoTestReport'
        }

        tasks.named('jacocoTestReport') {
            dependsOn 'test'
            reports {
                xml.required = true
                html.required = true
                csv.required = false
            }
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExcludes)
            }))
        }

        tasks.named('jacocoTestCoverageVerification') {
            dependsOn 'jacocoTestReport'
            violationRules {
                rule {
                    limit {
                        counter = 'INSTRUCTION'
                        value = 'COVEREDRATIO'
                        minimum = 0.18
                    }
                }
            }
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExcludes)
            }))
        }
    }
}
