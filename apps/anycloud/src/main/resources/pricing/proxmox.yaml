# Proxmox VE qemu_vm pricing.
#
# Proxmox 는 on-prem hypervisor — public-cloud "instance type" 개념이 없다. 본 catalog 는 backend
# 의 spec 이름 "proxmox-{tier}-{cpu}x{memGb}" 형식 (예: proxmox-standard-4x8) 에 맞춰 baseline 가격
# 을 표시한다. 가격은 무료가 아니라 자체 데이터센터 TCO (전기 + 하드웨어 감가 + 운영) 기반.
provider: proxmox
currency: USD
region: default
spotDiscount: 0.0         # bare-metal hypervisor — spot 개념 없음
updatedAt: "2026-05-24"
notes: |
  Proxmox is a bare-metal hypervisor running on your own hardware — these
  prices are PLACEHOLDER TCO estimates (power + hardware depreciation + ops
  labor amortized over 3 years for typical commodity x86). They are not
  charged by anyone. Override per-deployment if you track real chargeback.

instanceTypes:
  # proxmox-standard-{cpu}x{memGb} — backend 의 spec 키와 일치
  proxmox-standard-2x4:    { hourly: 0.012, vcpu: 2,  memoryGb: 4 }
  proxmox-standard-4x8:    { hourly: 0.024, vcpu: 4,  memoryGb: 8 }
  proxmox-standard-8x16:   { hourly: 0.048, vcpu: 8,  memoryGb: 16 }
  proxmox-standard-16x32:  { hourly: 0.096, vcpu: 16, memoryGb: 32 }
  proxmox-standard-32x64:  { hourly: 0.192, vcpu: 32, memoryGb: 64 }
  # GPU passthrough (NVIDIA / AMD discrete card on PCIe)
  proxmox-gpu-8x32:        { hourly: 0.300, vcpu: 8,  memoryGb: 32, gpu: 1 }
  proxmox-gpu-16x64:       { hourly: 0.500, vcpu: 16, memoryGb: 64, gpu: 1 }
