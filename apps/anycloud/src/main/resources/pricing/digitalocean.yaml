# DigitalOcean Droplet pricing.
#
# 출처: https://www.digitalocean.com/pricing/droplets. DO 는 region 별 가격이 거의 동일 (flat).
# DO 는 commodity spot/preemptible 미지원 (NodeSpec.UseSpot=no-op).
provider: digitalocean
currency: USD
region: nyc1
spotDiscount: 0.0         # DO 표준 spot 미지원
updatedAt: "2026-05-24"
notes: |
  Prices reflect global Droplet list price as of 2026-05-24 — DigitalOcean
  uses near-flat region pricing. Backups (20% surcharge) and DigitalOcean
  Managed Kubernetes control-plane fee NOT included.

