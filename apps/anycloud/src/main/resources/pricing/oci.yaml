# Oracle Cloud Infrastructure (OCI) compute pricing.
#
# 출처: us-ashburn-1 pay-as-you-go (https://www.oracle.com/cloud/compute/pricing/).
# OCI 는 free-tier 자원이 일부 포함 — 본 catalog 는 paid tier 가격만 표시.
# OCI 는 일반 instance 의 preemptible/spot 미지원 (NodeSpec.UseSpot=no-op).
provider: oci
currency: USD
region: us-ashburn-1
spotDiscount: 0.0         # OCI 는 표준 spot 미지원
updatedAt: "2026-05-24"
notes: |
  Prices reflect us-ashburn-1 pay-as-you-go list price as of 2026-05-24.
  OCI uses an OCPU model (1 OCPU = 2 vCPU equivalent for x86 shapes); this
  catalog reports OCPU-derived vCPU for consistency with other clouds.
  Other regions vary ±5-15%. OCI does NOT offer commodity spot instances.

instanceTypes:
  # VM.Standard.E4.Flex (AMD EPYC, flexible)
  VM.Standard.E4.Flex_1:   { hourly: 0.025,  vcpu: 2,  memoryGb: 16 }
  VM.Standard.E4.Flex_2:   { hourly: 0.050,  vcpu: 4,  memoryGb: 32 }
  VM.Standard.E4.Flex_4:   { hourly: 0.100,  vcpu: 8,  memoryGb: 64 }
  VM.Standard.E4.Flex_8:   { hourly: 0.200,  vcpu: 16, memoryGb: 128 }
  # VM.Standard3.Flex (Intel Ice Lake, flexible)
  VM.Standard3.Flex_1:     { hourly: 0.044,  vcpu: 2,  memoryGb: 16 }
  VM.Standard3.Flex_2:     { hourly: 0.088,  vcpu: 4,  memoryGb: 32 }
  VM.Standard3.Flex_4:     { hourly: 0.176,  vcpu: 8,  memoryGb: 64 }
  # VM.Standard.A1.Flex (Ampere Altra, ARM — 가성비 강점)
  VM.Standard.A1.Flex_1:   { hourly: 0.010,  vcpu: 2,  memoryGb: 6 }
  VM.Standard.A1.Flex_2:   { hourly: 0.020,  vcpu: 4,  memoryGb: 12 }
  VM.Standard.A1.Flex_4:   { hourly: 0.040,  vcpu: 8,  memoryGb: 24 }
  # GPU shapes
  VM.GPU.A10.1:            { hourly: 2.000,  vcpu: 30, memoryGb: 240, gpu: 1 }
  VM.GPU.A10.2:            { hourly: 4.000,  vcpu: 60, memoryGb: 480, gpu: 2 }
  # VM.GPU3.1 (V100) — gpu-small alias
  VM.GPU3.1:                { hourly: 1.275, vcpu: 6,  memoryGb: 90,  gpu: 1 }
  # BM.GPU.A100-v2.8 (A100 8x) — gpu-large alias
  BM.GPU.A100-v2.8:         { hourly: 26.00, vcpu: 128, memoryGb: 2048, gpu: 8 }
  # BM.GPU.H100.8 (H100 8x) — gpu-h100 alias
  BM.GPU.H100.8:            { hourly: 80.00, vcpu: 112, memoryGb: 2048, gpu: 8 }
