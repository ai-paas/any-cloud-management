{{/*
RBAC — 2 트랙.
  core      : read-only (LIST_PODS, GET_LOG, ClusterInfo). 모든 dev/prod 에서 권장.
  installer : mutating (Helm install/uninstall). AllowList ConfigMap 이 enforcing layer.
recommended: 둘 다 활성. 단일 pod 모드는 installer SA 로 통합 실행.
*/}}
{{- if .Values.rbac.core.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
rules:
# generic K8s resource explorer 가 third-party CRD 까지 cover 하도록 wildcard read 부여.
# 명시 group (core/apps/networking/storage 등) 만으로는 crossplane/cert-manager/velero/kyverno
# 등의 CRD instance LIST 가 403 으로 막혀 backend 가 AGENT_INACTIVE 로 잘못 분류 됨.
#
# 트레이드오프 (사용자 승인 — Wildcard read 모든 CRD cover 선택):
#  - secrets 도 read 가능: agent 가 LIST_RESOURCES 로 secret value (base64) 를 backend 응답에
#    그대로 전달. mTLS / kubeconfig / oauth client secret 등 노출. UI 의 secret 탐색이 필요한
#    환경에서는 의도된 동작. compliance 환경에서는 본 rule 을 narrow 하거나 backend 단에서
#    resourceType=="secrets" 응답을 redact 하는 추가 처리 필요.
#  - get/list/watch 만 — mutating verb 부재. APPLY_MANIFEST / DELETE_RESOURCE 는 별도 installer SA.
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
# pods/log + pods/status — subresource 는 wildcard 가 cover 안 함. 명시 유지.
- apiGroups: [""]
  resources: ["pods/log", "pods/status"]
  verbs: ["get"]
# pods/exec — kubectl exec 등가. WebSocket terminal 진입 시 K8s API server 가 SubjectAccessReview
# 로 SA 의 create on pods/exec 권한 확인. 미부여 시 forbidden 으로 EXEC_FAILED 반환.
# allowed_exec_namespaces (agent 측 allowlist) 와 별개 — K8s RBAC 통과 + agent allowlist 통과 둘 다 필수.
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
# metrics.k8s.io — verbs 가 list 만 — wildcard 와 동일하므로 사실상 redundant 이나 가시성 위해 유지.
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
# K8s Impersonation 권한.
#
# backend 가 CommandRequest.impersonate_user 를 채워 보내면 agent 가 rest.Config.Impersonate 로
# K8s API 에 user identity 를 전달. K8s 가 그 verb 를 허용하려면 agent SA 에 impersonate 권한 필요.
#
# 사실상 super-admin 권한 (K8s 의 모든 user 흉내 가능) — gateway 인증을 신뢰의 root 로 명시.
# backend 의 security.auth.enabled toggle 이 OFF 면 backend 가 impersonate_user 를 채우지 않아
# 본 권한 사용 안 됨 (admin-equivalent 그대로). toggle ON 환경 (gateway 가 user 검증 후 헤더 전파)
# 에서만 동작. 미사용 환경에서도 권한 부여 자체는 무해 — invoke 안 하면 0 비용.
- apiGroups: [""]
  resources: ["users", "groups", "serviceaccounts"]
  verbs: ["impersonate"]
# UserExtra (X-Remote-Extra-* 헤더 등가). K8s authentication.k8s.io 의 UserExtra 권한.
# 거의 사용 안 되나 OIDC custom claim → K8s extras 매핑 시 필요.
- apiGroups: ["authentication.k8s.io"]
  resources: ["userextras/*"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.core.serviceAccountName }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.core.serviceAccountName }}
  namespace: {{ .Values.agent.namespace }}
---
# Leader election — Lease 권한 (replicas > 1 시 필요).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}-leader-election
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "patch", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}-leader-election
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rbac.core.serviceAccountName }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.core.serviceAccountName }}
  namespace: {{ .Values.agent.namespace }}
---
# Identity token Secret writer — agent 가 60일 opaque identity_token 을 K8s Secret 에 영구
# 저장. pod restart (kubectl rollout restart) 이후에도 같은 token 으로 backend 인증 가능 →
# 10분 TTL REGISTRATION_TOKEN 없이 재시작 안정. mTLS cert Secret 과 동일 Namespace-scope Role +
# resourceNames 로 1개 Secret 만 좁힘 (security narrow scope).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}-identity-writer
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
rules:
# delete: agent self-heal — backend 가 Unauthenticated 를 N회 연속 반환하면 Secret 무효화 후 pod
# 재시작으로 fresh re-bootstrap. cluster 재생성 후 stale token 자동 복구.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["cluster-agent-identity"]
  verbs: ["get", "update", "patch", "delete"]
# create 는 resourceNames 와 함께 쓸 수 없음 (K8s RBAC 제약 — create 시점엔 name 검증 못 함).
# 별도 rule 로 list 전체 namespace 안에서 secrets create 허용. 실제 어떤 이름으로든 create 가
# 가능하지만, 운영자 의도 (cluster-agent-identity) 외 사용은 코드에서 막힘.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}-identity-writer
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rbac.core.serviceAccountName }}-identity-writer
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.core.serviceAccountName }}
  namespace: {{ .Values.agent.namespace }}
---
# AllowList writer — APPLY_AGENT_CONFIG (proto enum 26) handler 가 자기 ConfigMap 을 patch
# 할 수 있게 한정 권한 부여. ClusterRole 이 아닌 Role 사용 — agent namespace 안의 단일
# ConfigMap (resourceNames 로 정확히 한 개 지정) 에만 작용. RBAC 폭발 회피.
#
# 비활성화: --set allowlist.applyAgentConfigEnabled=false 로 Role/RoleBinding 미생성.
# 그러면 APPLY_AGENT_CONFIG 호출 시 dispatcher 가 FORBIDDEN 반환 → operator 는 kubectl edit 만 가능.
#
# Sprig 의 `default` 는 false 도 "empty" 로 취급해 default 값을 채워버리므로 (Go template 의
# truthiness 룰) 명시적 `hasKey` + ne false 패턴 사용. nil 이면 default=true, false 면 그대로 false.
{{- $applyEnabled := true -}}
{{- if hasKey .Values.allowlist "applyAgentConfigEnabled" -}}
  {{- $applyEnabled = .Values.allowlist.applyAgentConfigEnabled -}}
{{- end -}}
{{- if $applyEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}-allowlist-writer
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
rules:
# reconciler 제거 — configmap watch + update 만 (APPLY_AGENT_CONFIG 처리용).
# events / create 권한 폐기.
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ .Values.allowlist.configMapName | default "aipaas-agent-allowlist" | quote }}]
  verbs: ["get", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rbac.core.serviceAccountName }}-allowlist-writer
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rbac.core.serviceAccountName }}-allowlist-writer
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.core.serviceAccountName }}
  namespace: {{ .Values.agent.namespace }}
{{- end }}
{{- end }}
{{- if .Values.rbac.installer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.installer.serviceAccountName }}
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.installer.serviceAccountName }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps", "serviceaccounts", "services", "endpoints"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["*"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["*"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["*"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["*"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if .Values.rbac.installer.allowEscalation }}
# allowEscalation=true (default, 운영 검증 전 호환).
# - escalate: ClusterRole 의 모든 rule 을 부여하기 위해 자신이 그 권한을 보유해야 한다는 규칙 면제.
# - bind: ClusterRoleBinding 으로 임의의 ClusterRole 을 임의의 subject 에 바인딩.
# - webhook 전권: prometheus-operator / cert-manager 의 mutating/validating webhook 등록.
# 이 권한들이 있으면 cert-manager / kube-prometheus-stack / velero / ingress-nginx 등
# 자체 RBAC 동봉 chart 의 install 이 single rule 로 cover. 보안 contract: agent installer SA
# = effective cluster-admin.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "clusterroles"]
  verbs: ["escalate", "bind"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- else }}
# allowEscalation=false. installer SA 의 cluster-admin equiv 권한 회수.
# 새 ClusterRole 생성은 installer SA 가 그 rule 을 보유한 verbs 만, webhook 등록은 차단.
# OIDC binding 자동 적용은 chart 동봉 ClusterRole 만 reference — escalate/bind 불필요.
{{- end }}
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch", "create", "patch"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["cert-manager.io"]
  resources: ["*"]
  verbs: ["*"]
# kube-prometheus-stack 차트가 만드는 cluster-scoped 자원 cover.
# autoscaling: kube-prometheus-stack 의 HorizontalPodAutoscaler.
# scheduling: PriorityClass (일부 chart 가 생성).
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["scheduling.k8s.io"]
  resources: ["priorityclasses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.installer.serviceAccountName }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.installer.serviceAccountName }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.installer.serviceAccountName }}
  namespace: {{ .Values.agent.namespace }}
{{- if and .Values.rbac.core.enabled (eq (.Values.deployment.mode | default "single") "single") }}
---
# 단일 pod 모드 — installer SA 로 helm install + read 모두 수행.
# installer ClusterRole 은 mutating 권한만 — read-only 자원 (nodes, PVs, StorageClasses,
# CRDs 등) 은 core ClusterRole 에 정의됨. installer SA 를 core ClusterRole 에도 추가
# 바인딩해서 read coverage 확보.
# split 모드 (deployment.mode=split) 에서는 본 binding 생성 안 함 — core pod 가 별도 SA 보유.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.installer.serviceAccountName }}-core-read
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.core.serviceAccountName }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.installer.serviceAccountName }}
  namespace: {{ .Values.agent.namespace }}
{{- end }}
{{- end }}
{{- if and .Values.rbac.adminKubeconfig .Values.rbac.adminKubeconfig.enabled }}
---
# VM(PULUMI) 프로비저닝 cluster 의 "전체 권한 kubeconfig" 다운로드용 admin SA.
# GET /v1/clusters/{name}/kubeconfig 가 이 SA 의 단기 token 을 agent GENERATE_KUBECONFIG 로 발급.
# 단기 토큰만 발급 — 정적 자격 아님 (폐기/감사 가능). backend 가 VM cluster 에만 enabled=true 로 렌더.
# impersonation/per-user RBAC 활성 시: 본 SA 는 break-glass 로 강등하고 endpoint 기본값을 per-user
# 해석으로 교체 — 엔드포인트 계약 변경 없이 additive. enabled=false 면 본 블록 미생성.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.adminKubeconfig.serviceAccountName | default "aipaas-admin" }}
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.adminKubeconfig.serviceAccountName | default "aipaas-admin" }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.adminKubeconfig.serviceAccountName | default "aipaas-admin" }}
  namespace: {{ .Values.agent.namespace }}
{{- end }}
