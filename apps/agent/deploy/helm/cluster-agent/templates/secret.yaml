{{/*
Bootstrap token secret. registrationToken 이 명시되고 existingSecret 이 비었을 때만 생성.
- existingSecret 사용 시 (kubectl 로 미리 만들어둔 경우): chart 가 secret 을 만들지 않음.
- 둘 다 비었을 때 (registrationToken="" + existingSecret=""): chart 는 secret 을 만들지 않음.
  Deployment 가 정상 동작하려면 사용자가 외부에서 aipaas-agent-bootstrap secret 을 만들거나
  --set bootstrap.registrationToken=<JWT> 로 재설치 필요.
*/}}
{{- if and .Values.bootstrap.registrationToken (not .Values.bootstrap.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-agent.bootstrapSecretName" . }}
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
  annotations:
    # Helm hook — 재설치 시 token 회전 보장. install/upgrade 마다 새로 적용.
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation"
type: Opaque
stringData:
  {{ .Values.bootstrap.secretKey }}: {{ .Values.bootstrap.registrationToken | quote }}
{{- end }}
