apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  # headless — endpoints 가 pod IP 그대로 노출. cluster-agent 가 endpoint slice 로 노드별 IP 발견.
  clusterIP: None
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: grpc
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
