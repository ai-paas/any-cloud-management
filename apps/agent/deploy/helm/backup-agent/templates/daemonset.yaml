apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    aipaas.io/component: backup-agent
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        aipaas.io/component: backup-agent
    spec:
      serviceAccountName: {{ .Release.Name }}
      hostNetwork: true   # etcd 가 control-plane node 의 127.0.0.1:2379 에서만 listen
      hostPID: false
      priorityClassName: {{ .Values.priorityClassName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: backup-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_AGENT_PORT
              value: "{{ .Values.port }}"
          ports:
            - name: grpc
              containerPort: {{ .Values.port }}
              hostPort: {{ .Values.port }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false   # etcd healthcheck-client.key (0600 root:root) 읽기 필요
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: etc-kubernetes
          hostPath: { path: {{ .Values.hostPaths.etcKubernetes }}, type: Directory }
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit | default "4Gi" }}
