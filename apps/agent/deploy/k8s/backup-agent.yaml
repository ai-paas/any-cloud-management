# backup-agent DaemonSet — etcd snapshot + PKI tar 전용. 최소 권한.
#
# 책임: 자기 노드의 etcd 에 client TLS 로 접속해 snapshot 받기, /etc/kubernetes/pki tar+gzip.
# 책임 외: kubeadm upgrade, OS package upgrade — anycloud 의 scope 가 아님 (수동 / 외부 도구).
#
# 보안 강화:
#   - hostPath 마운트는 /etc/kubernetes 1개만 (RO)
#   - privileged: false, hostPID: false, hostNetwork: true (etcd localhost 접근 위해 유지)
#   - capabilities drop ALL, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true
#   - runAsUser: 0 (root) — etcd healthcheck-client.key 가 0600 root:root 라 필수.
#     ambient capability 가 좁혀져 있어 사실상 RO file reader.
apiVersion: v1
kind: Namespace
metadata:
  name: aipaas-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-agent
  namespace: aipaas-system
---
# backup-agent 는 K8s API 호출 필요 없음 — 자기 노드의 명령만 실행. ClusterRole 부여 X.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: backup-agent
  namespace: aipaas-system
  labels:
    app: backup-agent
    aipaas.io/component: backup-agent
spec:
  selector:
    matchLabels:
      app: backup-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: backup-agent
        aipaas.io/component: backup-agent
    spec:
      serviceAccountName: backup-agent
      hostNetwork: true   # etcd 가 control-plane node 의 127.0.0.1:2379 에서만 listen
      hostPID: false
      tolerations:
        # control-plane taint 포함 모든 노드 — etcd snapshot 은 control-plane 에서만 가능
        - operator: Exists
      priorityClassName: system-node-critical
      containers:
        - name: backup-agent
          image: ghcr.io/aipaas/backup-agent:latest   # 운영에서 pin 권장
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_AGENT_PORT
              value: "9090"
          ports:
            - name: grpc
              containerPort: 9090
              hostPort: 9090   # cluster-agent 가 nodeIP:9090 으로 접근. NetworkPolicy 로 가두기 권장.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false   # etcd healthcheck-client.key (0600 root:root) 읽기 필요
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
              # etcd cert (/etc/kubernetes/pki/etcd/*) + control-plane 확인용 manifests/etcd.yaml.
              # tar 도 read 만 수행.
            - name: tmp
              mountPath: /tmp
              # etcdctl snapshot save 의 임시 파일 (os.CreateTemp). emptyDir 로 writable.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: etc-kubernetes
          hostPath: { path: /etc/kubernetes, type: Directory }
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi   # etcd snapshot 크기 limit — 대규모 cluster 는 override
---
# headless service — 각 podIP 가 그대로 expose, load balance 없이 노드 특정 접근.
apiVersion: v1
kind: Service
metadata:
  name: backup-agent
  namespace: aipaas-system
  labels:
    app: backup-agent
spec:
  clusterIP: None
  selector:
    app: backup-agent
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
