# 에서만 동작. 미사용 환경에서도 권한 부여 자체는 무해 — invoke 안 하면 0 비용.
- apiGroups: [""]
  resources: ["users", "groups", "serviceaccounts"]
  verbs: ["impersonate"]
# UserExtra (X-Remote-Extra-* 헤더 등가). K8s authentication.k8s.io 의 UserExtra 권한.
