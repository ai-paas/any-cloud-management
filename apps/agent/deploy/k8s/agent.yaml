apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-agent
  namespace: aipaas-system
  labels:
    helm.sh/chart: cluster-agent-0.1.0
    app.kubernetes.io/name: cluster-agent
    app.kubernetes.io/instance: cluster-agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-agent
      app.kubernetes.io/instance: cluster-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-agent
        app.kubernetes.io/instance: cluster-agent
        app.kubernetes.io/component: agent
      annotations:
        "anycloud.aipaas/backend-grpc-addr": "host.docker.internal:9090"
    spec:
      serviceAccountName: aipaas-agent-installer
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: agent
        image: "aipaas/cluster-agent:dev"
        imagePullPolicy: IfNotPresent
        env:
        - name: AGENT_MODE
          value: "core"
        - name: BACKEND_GRPC_ADDR
          value: "host.docker.internal:9090"
        - name: REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: aipaas-agent-bootstrap
              key: registration-token
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AGENT_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: AGENT_LEADER_ELECTION
          value: "false"
        - name: AGENT_NAMESPACE
          value: "aipaas-system"
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
