# 명시 group (core/apps/networking/storage 등) 만으로는 crossplane/cert-manager/velero/kyverno
# 등의 CRD instance LIST 가 403 으로 막혀 backend 가 AGENT_INACTIVE 로 잘못 분류 됨.
#
# 트레이드오프 (사용자 승인 — Wildcard read 모든 CRD cover 선택):
#  - secrets 도 read 가능: agent 가 LIST_RESOURCES 로 secret value (base64) 를 backend 응답에
#    그대로 전달. mTLS / kubeconfig / oauth client secret 등 노출. UI 의 secret 탐색이 필요한
#    환경에서는 의도된 동작. compliance 환경에서는 본 rule 을 narrow 하거나 backend 단에서
#    resourceType=="secrets" 응답을 redact 하는 추가 처리 필요.
