# K8s API 에 user identity 를 전달. K8s 가 그 verb 를 허용하려면 agent SA 에 impersonate 권한 필요.
#
# 사실상 super-admin 권한 (K8s 의 모든 user 흉내 가능) — gateway 인증을 신뢰의 root 로 명시.
# backend 의 security.auth.enabled toggle 이 OFF 면 backend 가 impersonate_user 를 채우지 않아
