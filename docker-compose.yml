# =============================================================================
# Anycloud production-like compose — image pull only, no local build.
#
# 2026-05-26 (H-42): docker hub 에 publish 된 backend / agent / pulumi 이미지 사용.
# 클론 없이 환경변수만 채우면 한 줄로 동작 — 데모 / 외부 평가 / 운영 환경.
#
# 사용:
#   set -a; source .env.prod; set +a    # 또는 직접 export
#   docker compose up -d
#
# Dev (source 가 있는 사람) 은 docker-compose.dev.yml 사용 — `make dev-up`.
#
# Required secrets (${VAR:?required} 게이트):
#   DB_PASS, DB_ROOT_PASS
#   RABBITMQ_PASS
#   RUSTFS_ROOT_PASSWORD
#   OPENBAO_DEV_ROOT_TOKEN
#   PULUMI_PASSPHRASE
#   ANYCLOUD_AGENT_JWT_SECRET
#   CSP_CREDENTIAL_ENCRYPTION_KEY
#   ANYCLOUD_AGENT_GRPC_PUBLIC_ENDPOINT
#
# 비-secret 변수 (DB_USER, RUSTFS_REGION, PULUMI_STACK_PREFIX 등) 는 default 보유:
#   - container path 류  → Dockerfile.pulumi 의 ENV
#   - 코드 합리적 default → config/*.yaml 의 ${X:default}
#   - service wiring     → 본 파일의 ${X:-default}
#
# Image tag override (선택):
#   ANYCLOUD_BACKEND_IMAGE_TAG=v0.0.1   # default: latest
#
# 영속 데이터 (ANYCLOUD_DATA_DIR, default ./data) — mariadb, rustfs 는 bind mount.
#   mkdir -p $ANYCLOUD_DATA_DIR/{mariadb,rustfs}
#   chown -R 1001:1001   $ANYCLOUD_DATA_DIR/mariadb
#   chown -R 10001:10001 $ANYCLOUD_DATA_DIR/rustfs
# =============================================================================
services:
  # --- MariaDB --------------------------------------------------------------
  mariadb:
    image: linuxserver/mariadb:10.11.3
    container_name: anycloud-mariadb
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS must be set (use openssl rand -hex 24)}
      MYSQL_DATABASE: anycloud
      MYSQL_USER: ${DB_USER:-anycloud}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS must be set (use openssl rand -hex 24)}
      PUID: 1001
      PGID: 1001
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${ANYCLOUD_DATA_DIR:-./data}/mariadb:/config
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1G }

  # --- RabbitMQ -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: anycloud-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-anycloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # --- RustFS (Pulumi state backend, S3-compatible) -------------------------
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.99
    container_name: anycloud-rustfs
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-anycloud}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD must be set (use openssl rand -hex 32)}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    volumes:
      - ${ANYCLOUD_DATA_DIR:-./data}/rustfs:/data
    healthcheck:
      # RustFS 1.0.0-alpha.99 — MinIO /minio/health/live 미구현. S3 API root 의 200/403/400
      # 응답을 healthy 로 인정 (binary LISTEN 의 evidence).
      test:
        - CMD-SHELL
        - "wget -qSO /dev/null http://localhost:9000/ 2>&1 | grep -qE 'HTTP/.* (200|403|400)' || exit 1"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- OpenBao (Vault OSS fork) ---------------------------------------------
  # dev 모드 — 메모리 저장, unseal 없음, TLS 없음. 재시작하면 데이터가 사라진다.
  # PULUMI_SECRETS_PROVIDER 를 hashivault:// 로 바꾸면 재시작 시 state 복호화 불가.
  # production 전환: server -config + raft/file storage, auto-unseal, TLS, AppRole.
  openbao:
    image: openbao/openbao:latest
    container_name: anycloud-openbao
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:?OPENBAO_DEV_ROOT_TOKEN must be set}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    healthcheck:
      # OpenBao CLI default 는 HTTPS — dev/-dev mode 는 HTTP. BAO_ADDR override.
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- Bucket bootstrap ------------------------------------------------------
  pulumi-backend-bootstrap:
    image: amazon/aws-cli:2.17.0
    container_name: anycloud-pulumi-bootstrap
    depends_on:
      rustfs:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ROOT_USER:-anycloud}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_ROOT_PASSWORD}
      AWS_REGION: ${RUSTFS_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket pulumi-state 2>/dev/null || true
        echo "rustfs bucket pulumi-state ready"
    restart: "no"

  # --- Backend (pull from Docker Hub) ---------------------------------------
  anycloud-backend:
    image: ${ANYCLOUD_BACKEND_IMAGE:-ghcr.io/ai-paas/anycloud-backend}:${ANYCLOUD_BACKEND_IMAGE_TAG:-latest}
    container_name: anycloud-backend
    ports:
      - "8888:8888"   # REST + Swagger
      - "9090:9090"   # gRPC inbound (agents)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pulumi-backend-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- --tries=1 --timeout=2 http://localhost:8888/actuator/health/readiness || exit 1"
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 5
    environment:
      APP_ROLE: backend
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp}
      # --- Service wiring (compose-only) ---
      DATABASE_HOST: mariadb
      DATABASE_NAME: anycloud
      DATABASE_USERID: ${DB_USER:-anycloud}
      DATABASE_USERPASS: ${DB_PASS}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-anycloud}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ROOT_USER:-anycloud}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_ROOT_PASSWORD}
      AWS_REGION: ${RUSTFS_REGION:-us-east-1}
      VAULT_ADDR: ${VAULT_ADDR:-http://openbao:8200}
      # 중첩 보간 금지 (compose v1 미지원). 빈 값일 때의 fallback 은 entrypoint 가 처리.
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      OPENBAO_DEV_ROOT_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:?OPENBAO_DEV_ROOT_TOKEN must be set}
      PULUMI_BACKEND_URL: ${PULUMI_BACKEND_URL:-s3://pulumi-state?endpoint=http://rustfs:9000&s3ForcePathStyle=true&disableSSL=true}
      # --- yaml default override (compose 에서 명시적 enable) ---
      PULUMI_ENABLED: "true"
      VM_CLUSTER_WORKFLOW_ENABLED: "true"
      # --- Required secrets (fail-fast gate) ---
      PULUMI_PASSPHRASE: ${PULUMI_PASSPHRASE:?PULUMI_PASSPHRASE must be set}
      ANYCLOUD_AGENT_JWT_SECRET: ${ANYCLOUD_AGENT_JWT_SECRET:?ANYCLOUD_AGENT_JWT_SECRET must be set}
      CSP_CREDENTIAL_ENCRYPTION_KEY: ${CSP_CREDENTIAL_ENCRYPTION_KEY:?CSP_CREDENTIAL_ENCRYPTION_KEY must be set}
      ANYCLOUD_AGENT_GRPC_PUBLIC_ENDPOINT: ${ANYCLOUD_AGENT_GRPC_PUBLIC_ENDPOINT:?ANYCLOUD_AGENT_GRPC_PUBLIC_ENDPOINT must be set (e.g. anycloud.example.com:9090)}
      # --- Optional ---
      # 사용자가 직접 helm install 할 때 안내에 들어갈 chart repo URL (HELM_BOOTSTRAP / MANUAL).
      # backend 의 자동 설치는 jar 에 packaged 된 chart 를 쓰므로 비워도 된다.
      ANYCLOUD_AGENT_HELM_REPO_URL: ${ANYCLOUD_AGENT_HELM_REPO_URL:-}
      # Cluster 등록 응답의 kubectl apply 명령에 박히는 base URL. 미설정 시 HTTP 요청 host 자동 사용.
      ANYCLOUD_PUBLIC_URL: ${ANYCLOUD_PUBLIC_URL:-}
    volumes:
      - pulumi-home:/app/.pulumi
      - pulumi-runtime:/app/runtime
    deploy:
      resources:
        limits: { memory: 4G, cpus: '2.0' }
        reservations: { memory: 2G, cpus: '1.0' }

  # --- Worker (pull from Docker Hub, same image, APP_ROLE=worker) -----------
  anycloud-bootstrap-worker:
    image: ${ANYCLOUD_BACKEND_IMAGE:-ghcr.io/ai-paas/anycloud-backend}:${ANYCLOUD_BACKEND_IMAGE_TAG:-latest}
    container_name: anycloud-bootstrap-worker
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pulumi-backend-bootstrap:
        condition: service_completed_successfully
      anycloud-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "java"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 5
    environment:
      APP_ROLE: worker
      # vm-cluster-worker 없이는 bootstrap/verify listener 가 등록되지 않는다.
      # entrypoint 의 기본값은 compose 가 값을 넣는 순간 밀린다 (셸 :- 의미).
      SPRING_PROFILES_ACTIVE: docker,vm-cluster-worker
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      # --- Service wiring ---
      DATABASE_HOST: mariadb
      DATABASE_NAME: anycloud
      DATABASE_USERID: ${DB_USER:-anycloud}
      DATABASE_USERPASS: ${DB_PASS}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-anycloud}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ROOT_USER:-anycloud}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_ROOT_PASSWORD}
      AWS_REGION: ${RUSTFS_REGION:-us-east-1}
      VAULT_ADDR: ${VAULT_ADDR:-http://openbao:8200}
      # 중첩 보간 금지 (compose v1 미지원). 빈 값일 때의 fallback 은 entrypoint 가 처리.
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      OPENBAO_DEV_ROOT_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:?OPENBAO_DEV_ROOT_TOKEN must be set}
      PULUMI_BACKEND_URL: ${PULUMI_BACKEND_URL:-s3://pulumi-state?endpoint=http://rustfs:9000&s3ForcePathStyle=true&disableSSL=true}
      # --- yaml default override ---
      PULUMI_ENABLED: "true"
      VM_CLUSTER_WORKFLOW_ENABLED: "true"
      VM_CLUSTER_WORKFLOW_WORKER_ENABLED: "true"
      # --- Required secrets ---
      PULUMI_PASSPHRASE: ${PULUMI_PASSPHRASE}
      ANYCLOUD_AGENT_JWT_SECRET: ${ANYCLOUD_AGENT_JWT_SECRET}
      CSP_CREDENTIAL_ENCRYPTION_KEY: ${CSP_CREDENTIAL_ENCRYPTION_KEY}
    volumes:
      - pulumi-home:/app/.pulumi
      - pulumi-runtime:/app/runtime
    deploy:
      resources:
        limits: { memory: 4G, cpus: '2.0' }
        reservations: { memory: 2G, cpus: '1.0' }

# mariadb, rustfs 는 bind mount 라 여기 없다. ANYCLOUD_DATA_DIR 참고.
# 아래 셋은 유실돼도 재생성되는 것들 — 큐의 처리 중 메시지, 플러그인 캐시, 작업 디렉토리.
# 호스트 경로 MTU 가 1500 보다 작은 환경(터널 등)에서는 맞춰야 한다. daemon.json 의 mtu 는
# 기본 브리지에만 적용되고 compose 가 만드는 네트워크는 물려받지 않는다. 어긋나면 TLS
# ServerHello 처럼 큰 응답이 버려져 인증서 체인이 긴 엔드포인트만 타임아웃된다.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${ANYCLOUD_NETWORK_MTU:-1500}

volumes:
  rabbitmq-data:
  pulumi-home:
  pulumi-runtime:
