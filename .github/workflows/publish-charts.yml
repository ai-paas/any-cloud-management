name: Publish Helm Charts (GHCR OCI)

# cluster-agent helm chart 를 oci://ghcr.io/<owner>/charts 로 push.
# 사용자가 등록 모달의 helm install 명령을 그대로 실행하는 대상.
#
# 발동 조건:
#   - tag push (cluster-agent-vX.Y.Z) → chart version 0.1.0, appVersion vX.Y.Z
#   - workflow_dispatch               → 같은 동작, 수동 재배포용
#
# chart version 은 0.1.0 고정 (Chart.yaml 과 동일). dev iteration 동안 같은 좌표를 overwrite
# 하는 전제라 backend 의 agent.helm.chart-version default 와 Bruno body 가 항상 일치.
# 실제로 어떤 agent 가 배포되는지는 appVersion 이 들고 감.
#
# Chart 는 처음 push 시 GHCR 에서 private. public 공개는 GitHub Packages UI 에서 1회 토글.
# private 상태면 사용자가 helm registry login 을 먼저 해야 하므로 모달 안내와 어긋남.

on:
  push:
    tags: ['cluster-agent-v*.*.*']
  workflow_dispatch:
    inputs:
      app_version:
        description: 'appVersion (예: v0.3.2). 미입력 시 dev'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-charts-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART_DIR: apps/agent/deploy/helm/cluster-agent
  CHART_NAME: cluster-agent
  # Chart.yaml 의 version 과 같아야 함. 어긋나면 backend 가 안내하는 --version 으로 pull 실패.
  CHART_VERSION: '0.1.0'

jobs:
  publish:
    name: Package & push cluster-agent chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Resolve appVersion
        id: ver
        run: |
          # tag push: cluster-agent-v0.3.2 → v0.3.2. dispatch: 입력값, 없으면 dev.
          if [ "${{ github.event_name }}" = "push" ]; then
            APP_VERSION="${GITHUB_REF_NAME#cluster-agent-}"
          else
            APP_VERSION="${{ github.event.inputs.app_version }}"
          fi
          if [ -z "$APP_VERSION" ]; then APP_VERSION="dev"; fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "appVersion=$APP_VERSION"

      - name: Verify chart version matches Chart.yaml
        run: |
          # Chart.yaml 과 workflow 가 어긋난 채 push 되면 backend 안내 명령이 404 를 받는다.
          DECLARED=$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')
          if [ "$DECLARED" != "$CHART_VERSION" ]; then
            echo "Chart.yaml version=$DECLARED, workflow CHART_VERSION=$CHART_VERSION — 불일치"
            exit 1
          fi

      - name: Lint
        run: helm lint "$CHART_DIR"

      - name: Package
        run: |
          helm package "$CHART_DIR" \
            --version "$CHART_VERSION" \
            --app-version "${{ steps.ver.outputs.app_version }}" \
            --destination dist

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push
        run: |
          helm push "dist/${CHART_NAME}-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Verify pull from registry
        run: |
          # push 성공과 pull 가능은 별개 — manifest 가 올라가도 좌표가 어긋나면 사용자만 발견한다.
          rm -rf verify && mkdir verify
          helm pull "oci://ghcr.io/${{ github.repository_owner }}/charts/${CHART_NAME}" \
            --version "$CHART_VERSION" --destination verify
          helm show chart "verify/${CHART_NAME}-${CHART_VERSION}.tgz"
