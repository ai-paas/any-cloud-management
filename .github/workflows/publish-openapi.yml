name: Publish OpenAPI Spec

# anycloud backend 의 OpenAPI 3.x spec 을 추출해 artifact + Pages 로 publish.
# frontend / 외부 consumer 가 openapi-generator-cli 로 type-safe client 자동 생성 →
# API 변경 시 frontend 가 컴파일 에러로 즉시 인지.
#
# Trigger:
#   - tag push (vX.Y.Z) : openapi/vX.Y.Z/ 로 versioned Pages publish. main branch tag 면
#                         openapi/latest/ alias 도 같이 갱신.
#   - workflow_dispatch : 응급 수동 publish — 같은 tag-driven path 사용.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-openapi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-publish:
    name: Extract OpenAPI + publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine source branch
        id: branch
        run: |
          BRANCH=$(git branch -r --contains ${{ github.sha }} \
            | grep -v 'HEAD' \
            | sed 's|^\s*origin/||' \
            | grep -E '^(main|hotfix/|release/)' \
            | head -1 \
            | xargs)
          if [ -z "$BRANCH" ]; then BRANCH="detached"; fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # 앱을 따로 띄우지 않는다. bootRun 은 main 런타임 클래스패스만 보는데 test 프로파일 설정이
      # src/test/resources 에 있어 datasource 조차 잡히지 않는다. 테스트는 Testcontainers 로
      # 이미 검증된 부팅 경로를 쓴다.
      - name: Extract OpenAPI spec
        run: ./gradlew :anycloud:test --tests '*OpenApiSpecDumpTest*' --no-daemon --console=plain

      # Docker 가 없으면 테스트가 skipped 로 끝나 build 는 성공한다. 산출물로 확인한다.
      - name: Collect spec
        run: |
          SRC=apps/anycloud/build/openapi/openapi.json
          if [ ! -s "$SRC" ]; then
            echo "::error::OpenAPI 스펙이 생성되지 않았습니다 ($SRC)"
            exit 1
          fi
          mkdir -p dist/openapi
          cp "$SRC" dist/openapi/openapi.json
          python3 - <<'PY'
          import json, pathlib, sys
          spec = json.loads(pathlib.Path("dist/openapi/openapi.json").read_text(encoding="utf-8"))
          paths = len(spec.get("paths", {}))
          if paths == 0:
              sys.exit("경로가 비어 있습니다 — 그룹 목록을 받았을 가능성이 큽니다")
          print(f"openapi={spec['openapi']} paths={paths}")
          PY

      - name: Upload as artifact (versioned)
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ github.ref_name }}
          path: dist/openapi/
          retention-days: 90

      - name: Publish to gh-pages (versioned)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/openapi
          destination_dir: openapi/${{ github.ref_name }}
          keep_files: true
          commit_message: "Publish OpenAPI spec ${{ github.ref_name }} from ${{ steps.branch.outputs.name }}"

      - name: Publish to gh-pages (latest alias, main branch tag only)
        if: steps.branch.outputs.is_main == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/openapi
          destination_dir: openapi/latest
          keep_files: true
          commit_message: "Publish OpenAPI spec latest (${{ github.ref_name }})"
