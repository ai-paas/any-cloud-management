name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 동일 브랜치/PR 의 진행 중 워크플로우는 새 push 가 들어오면 취소.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 네 job 모두 checkout 과 빌드만 한다. 기본값은 저장소 설정에 따라 write 까지 열리므로
# 워크플로우 쪽에서 읽기로 못박는다.
permissions:
  contents: read

jobs:
  java:
    name: Java build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Spotless 의 ratchetFrom='origin/main' 이 git diff 를 보려면 main 기록이 필요.
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true

      - name: Gradle build + spotless + starter publish
        run: |
          ./gradlew --no-daemon --console=plain --continue \
            :anycloud:build \
            :anycloud:spotlessCheck \
            :cluster-agent-spring-boot-starter:publishToMavenLocal \
            :cluster-agent-features-spring-boot-starter:publishToMavenLocal \
            :cluster-provisioning-spring-boot-starter:publishToMavenLocal

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            apps/anycloud/build/reports/tests/**
            apps/anycloud/build/test-results/**
          retention-days: 7

      - name: Upload checkstyle / spotless reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            apps/anycloud/build/reports/**
          retention-days: 7

  proto:
    name: Proto lint + breaking check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking 은 main branch 의 .proto 와 diff 필요 → fetch-depth=0.
          fetch-depth: 0

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # 정확한 version pin — major upgrade 시 lint rule / breaking rule 변경 가능성.
          version: 1.45.0
          # 토큰 없이 받으면 익명 rate limit 에 걸려 "API rate limit exceeded" 로 실패한다.
          # 실제로 PR CI 에서 발생했다.
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

      - name: buf breaking (against origin/main)
        if: github.event_name == 'pull_request'
        run: |
          if ! git ls-tree -r --name-only origin/main | grep -q '\.proto$'; then
            echo "origin/main 에 .proto 가 없어 breaking 검사를 건너뜁니다 (proto 최초 도입 PR)."
            exit 0
          fi
          buf breaking --against '.git#branch=origin/main'

  go:
    name: Go build + vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod 의 toolchain 을 따른다. 버전을 여기 박아두면 go.mod 와 어긋난다.
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum

      # apps/agent/internal/gen 은 .gitignore 대상이다 (buf 가 .proto 에서 생성).
      # 저장소에 없으므로 빌드 전에 만들어야 한다. proto job 과 같은 buf 버전을 쓴다.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.45.0
          github_token: ${{ github.token }}

      - name: buf generate (agent Go stubs)
        working-directory: .
        run: buf generate

      # go.mod 의 go 지시자보다 Dockerfile 의 GO_VERSION 이 낮으면 go build 가 거부한다.
      # publish-agents.yml 은 tag push 에서만 돌고 GO_VERSION 을 넘기지도 않아,
      # 어긋나면 릴리스 태그를 찍는 시점에야 드러난다. 여기서 먼저 막는다.
      - name: Check Dockerfile GO_VERSION matches go.mod
        run: |
          mod_go=$(grep -E '^go ' go.mod | awk '{print $2}')
          img_go=$(grep -E '^ARG GO_VERSION=' Dockerfile | cut -d= -f2)
          echo "go.mod=$mod_go  Dockerfile=$img_go"
          # major.minor 만 비교한다 (go.mod 은 1.26.0, 이미지 태그는 1.26).
          mod_mm=$(echo "$mod_go" | cut -d. -f1,2)
          img_mm=$(echo "$img_go" | cut -d. -f1,2)
          if [ "$(printf '%s\n%s\n' "$mod_mm" "$img_mm" | sort -V | head -1)" != "$mod_mm" ]; then
            echo "::error::Dockerfile GO_VERSION=$img_go < go.mod go=$mod_go — 이미지 빌드가 실패한다"
            exit 1
          fi

      - name: go mod download
        run: go mod download

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

  rustfs-smoke:
    name: RustFS + OpenBao smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # 셀프호스팅 Pulumi state backend (RustFS) + secrets provider (OpenBao) 가
    # docker-compose.dev.yml 정의대로 부팅하고, Pulumi CLI 가 login 까지 성공하는지
    # 회귀 검증. 라이선스(MinIO AGPLv3 회피, Vault BSL 회피) 결정의 핵심 의존성 보호.
    #
    # 자격증명은 job 레벨에 한 번만 둔다. compose 는 RUSTFS_ROOT_* 를, 검증 step 은
    # AWS_* 를 읽는데 두 곳에 따로 적어두면 어긋나도 조용히 SignatureDoesNotMatch 로만
    # 드러난다 (실제로 그렇게 실패했다).
    env:
      RUSTFS_ROOT_USER: anycloud
      RUSTFS_ROOT_PASSWORD: anycloud-secret
      RUSTFS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: anycloud
      AWS_SECRET_ACCESS_KEY: anycloud-secret
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Compose pull
        run: docker compose -f docker-compose.dev.yml pull rustfs openbao
        # bootstrap 컨테이너(amazon/aws-cli)는 작아서 pull 생략해도 ok.

      - name: Start rustfs + openbao
        # backend 빌드는 건너뛰고 self-hosted 의존성만 띄움.
        # --wait 은 "running/healthy 상태 도달"을 기다린다. 일회성 컨테이너를 같이 넣으면
        # bucket 생성 후 정상 종료(exit 0)한 것을 "running 아님"으로 읽어 실패한다.
        # 폴링 타이밍에 따라 갈리는 경쟁이라 로컬 5회 중 4회 실패했다. 장기 실행
        # 서비스만 --wait 에 둔다.
        run: |
          docker compose -f docker-compose.dev.yml up -d \
            --wait --wait-timeout 120 \
            rustfs openbao

      - name: Create pulumi-state bucket (bootstrap)
        # --exit-code-from 은 해당 컨테이너가 끝날 때까지 기다렸다가 그 종료 코드를
        # 그대로 반환한다. bucket 생성 실패를 여기서 잡는다.
        run: |
          docker compose -f docker-compose.dev.yml up \
            --exit-code-from pulumi-backend-bootstrap \
            pulumi-backend-bootstrap

      - name: Verify rustfs bucket via aws-cli
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION \
            amazon/aws-cli:2.17.0 \
            --endpoint-url http://127.0.0.1:9000 s3api list-buckets \
            --query 'Buckets[].Name' --output text | tee /tmp/buckets.txt
          grep -q pulumi-state /tmp/buckets.txt || { echo "::error::bucket pulumi-state missing"; exit 1; }

      - name: Verify openbao /sys/health
        run: |
          # initialized=true, sealed=false (dev mode 기본) 이어야 함.
          curl -fsS http://127.0.0.1:8200/v1/sys/health \
            | tee /tmp/bao-health.json
          jq -e '.initialized==true and .sealed==false' /tmp/bao-health.json

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5
        with:
          # 버전은 infra/pulumi/go.mod 의 SDK toolchain 과 정합.
          pulumi-version: 3.150.0

      - name: pulumi login against RustFS backend
        env:
          PULUMI_BACKEND_URL: s3://pulumi-state?endpoint=http://127.0.0.1:9000&s3ForcePathStyle=true&disableSSL=true
          PULUMI_CONFIG_PASSPHRASE: ci-smoke
        run: |
          pulumi login "${PULUMI_BACKEND_URL}"
          pulumi whoami

          # stack 명령은 project 컨텍스트를 요구한다. Pulumi Java 로 옮기면서 project 는
          # Automation API 가 런타임에 만들고 저장소에는 Pulumi.yaml 이 없으므로,
          # 임시 project 를 만들어 backend 를 실제로 읽고 쓴다. login 만으로는
          # 자격증명이 맞는지까지는 확인되지 않는다.
          workdir="$(mktemp -d)"
          cd "$workdir"
          printf 'name: ci-smoke\nruntime: nodejs\ndescription: CI backend smoke\n' > Pulumi.yaml

          pulumi stack ls --json | jq .
          pulumi stack init smoke
          pulumi stack ls --json | jq -e 'map(.name) | index("smoke") != null'
          pulumi stack rm smoke --yes

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs rustfs openbao pulumi-backend-bootstrap

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans
