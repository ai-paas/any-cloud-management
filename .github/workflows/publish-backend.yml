name: Publish Backend Image (GHCR)

# anycloud-backend image (Spring Boot jar + Pulumi pre-compiled binary + Helm + Pulumi CLI) 를
# Dockerfile.pulumi 로 빌드해 ghcr.io/<owner>/anycloud-backend 로 push.
#
# BuildKit registry remote cache 를 사용 — 같은 image repository 의 :buildcache 태그에 layer
# cache 저장. mode=max 로 모든 intermediate layer 보존 (Go SDK download / compile cache 가 핵심
# 절감 대상). 다음 push 의 fresh runner 도 cache hit.
#
# 발동 조건:
#   - tag push (vX.Y.Z)     → :vX.Y.Z, :X.Y, :sha-<short>, :{branch}-vX.Y.Z, :latest(main only)
#   - workflow_dispatch     → :<input.tag>(옵션), :sha-<short>
#
# main push 는 publish 안 함 — release tag 만 publish. :latest 는 tag 가 main branch 의
# commit 일 때만 부착 — hotfix branch tag 등은 :latest 안 됨.
# PULUMI_BUILD_TAGS input 으로 일부 CSP 만 빌드한 lean image 도 발행 가능 — workflow_dispatch
# 시점에 override.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional manual tag (e.g. v0.1.0-rc1)'
        required: false
      pulumi_build_tags:
        description: 'Pulumi CSP build tags (default: all). 콤마 구분 예: aws,gcp'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push anycloud-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine source branch
        id: branch
        run: |
          BRANCH=$(git branch -r --contains ${{ github.sha }} \
            | grep -v 'HEAD' \
            | sed 's|^\s*origin/||' \
            | grep -E '^(main|hotfix/|release/)' \
            | head -1 \
            | xargs)
          if [ -z "$BRANCH" ]; then BRANCH="detached"; fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected source branch: $BRANCH"

      - name: Set up QEMU (cross-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anycloud-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.branch.outputs.is_main == 'true' }}
            type=raw,value=${{ steps.branch.outputs.name }}-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.pulumi
          build-args: |
            PULUMI_BUILD_TAGS=${{ github.event.inputs.pulumi_build_tags || 'all' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # registry remote cache — 같은 image repo 의 :buildcache 태그 사용. GHCR 인증 재사용.
          # mode=max 로 multi-stage 의 모든 layer 보존 (Pulumi-builder 의 Go module download +
          # compile cache 가 가장 가치 큼).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/anycloud-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/anycloud-backend:buildcache,mode=max
