version: 2

# Dependabot — 매주 1회 자동 PR. patch / minor upgrade 만 — major 는 manual review.
# CVE notice 자동 인지 + supply chain risk 감소.

updates:
  # ============ Java (Gradle) ============
  - package-ecosystem: "gradle"
    directory: "/apps/anycloud"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    ignore:
      # Spring Boot major upgrade — BOM 충돌 가능, manual review
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # Spring AMQP major
      - dependency-name: "org.springframework.amqp:*"
        update-types: ["version-update:semver-major"]
      # MariaDB JDBC major
      - dependency-name: "org.mariadb.jdbc:*"
        update-types: ["version-update:semver-major"]
    groups:
      spring:
        patterns: ["org.springframework.*"]
        update-types: ["minor", "patch"]
      testcontainers:
        patterns: ["org.testcontainers:*"]
        # major 를 빼지 않으면 BOM 만 2.x 로 가고 k3s/localstack 은 1.x 로 남아
        # BOM 과 아티팩트 버전이 어긋난다.
        update-types: ["minor", "patch"]
      jackson:
        patterns: ["com.fasterxml.jackson*"]

  - package-ecosystem: "gradle"
    directory: "/libs/cluster-agent-spring-boot-starter"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "starter"
    ignore:
      # Spring Boot major — 이 저장소는 Boot 3.2.5 를 쓴다. starter 만 major 로 올리면
      # 배포 POM 에는 새 버전이 박히는데 앱은 3.2.5 로 해석되어 소비자 쪽에서만 깨진다.
      # apps/anycloud 와 같은 규칙을 둔다 (없어서 Boot 4.1.1 PR 이 올라왔다).
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    directory: "/libs/cluster-agent-features-spring-boot-starter"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "starter"
    ignore:
      # Spring Boot major — 이 저장소는 Boot 3.2.5 를 쓴다. starter 만 major 로 올리면
      # 배포 POM 에는 새 버전이 박히는데 앱은 3.2.5 로 해석되어 소비자 쪽에서만 깨진다.
      # apps/anycloud 와 같은 규칙을 둔다 (없어서 Boot 4.1.1 PR 이 올라왔다).
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    directory: "/libs/cluster-provisioning-spring-boot-starter"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "starter"
    ignore:
      # Spring Boot major — 이 저장소는 Boot 3.2.5 를 쓴다. starter 만 major 로 올리면
      # 배포 POM 에는 새 버전이 박히는데 앱은 3.2.5 로 해석되어 소비자 쪽에서만 깨진다.
      # apps/anycloud 와 같은 규칙을 둔다 (없어서 Boot 4.1.1 PR 이 올라왔다).
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]

  # ============ Go (cluster-agent) ============
  - package-ecosystem: "gomod"
    directory: "/apps/agent"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "agent"
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "google.golang.org/grpc"
        update-types: ["version-update:semver-major"]
    groups:
      # k8s 생태계는 lockstep 이다. apimachinery 만 올리면 client-go 가 참조하는
      # structured-merge-diff 버전이 어긋나 컴파일이 깨진다 (#9 가 그렇게 올라왔다).
      # helm 도 k8s.io/kubectl 을 통해 같은 축에 묶여 있어 함께 움직여야 한다.
      # k8s.io/* 는 0.x 라 minor 취급이므로 위 major ignore 로는 걸러지지 않는다.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "helm.sh/helm/v3"
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc"
          - "google.golang.org/protobuf"
        update-types: ["minor", "patch"]

  # ============ GitHub Actions ============
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # action major 는 입력 파라미터가 바뀌는 경우가 있다. publish-* 워크플로는
      # tag push 에서만 돌아 PR 시점에 검증되지 않으므로 릴리스 노트를 보고 수동으로 올린다.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============ Docker (base image) ============
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # JDK/JRE major 는 런타임 환경 변경이다. build.gradle 의 sourceCompatibility 와
      # 함께 결정해야 하므로 봇에 맡기지 않는다.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
